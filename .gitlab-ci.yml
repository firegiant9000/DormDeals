# GitLab CI/CD Pipeline Configuration
# This pipeline supports both frontend (React/TypeScript) and future backend (Express.js/SQL)

# Define stages
stages:
  - install
  - lint
  - test
  - build
  - deploy

# Define variables
variables:
  NODE_VERSION: "18"
  NPM_CACHE_KEY: "npm-cache-$CI_COMMIT_REF_SLUG"
  CACHE_FALLBACK_KEY: "npm-cache-main"

# Cache configuration for faster builds
cache:
  key: $NPM_CACHE_KEY
  paths:
    - node_modules/
    - .npm/
  policy: pull-push

# Frontend Pipeline
frontend_install:
  stage: install
  image: node:${NODE_VERSION}-alpine
  script:
    - npm ci --cache .npm --prefer-offline
  cache:
    key: $NPM_CACHE_KEY
    paths:
      - node_modules/
      - .npm/
    policy: pull-push
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
  only:
    - main
    - develop
    - merge_requests
    - feature/*

frontend_lint:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  dependencies:
    - frontend_install
  script:
    - npm run lint
  cache:
    key: $NPM_CACHE_KEY
    paths:
      - node_modules/
    policy: pull
  only:
    - main
    - develop
    - merge_requests
    - feature/*

frontend_test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  dependencies:
    - frontend_install
  script:
    - npm run test -- --coverage --watchAll=false
  coverage: '/Lines\s*:\s*(\d+\.\d+)%/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  cache:
    key: $NPM_CACHE_KEY
    paths:
      - node_modules/
    policy: pull
  only:
    - main
    - develop
    - merge_requests
    - feature/*

frontend_build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  dependencies:
    - frontend_install
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  cache:
    key: $NPM_CACHE_KEY
    paths:
      - node_modules/
    policy: pull
  only:
    - main
    - develop
    - merge_requests
    - feature/*

# Backend Pipeline (for future Express.js/SQL implementation)
backend_install:
  stage: install
  image: node:${NODE_VERSION}-alpine
  script:
    - cd backend || echo "Backend directory not found, skipping backend install"
    - npm ci --cache .npm --prefer-offline || echo "No backend package.json found"
  cache:
    key: backend-$NPM_CACHE_KEY
    paths:
      - backend/node_modules/
      - backend/.npm/
    policy: pull-push
  artifacts:
    paths:
      - backend/node_modules/
    expire_in: 1 hour
  only:
    - main
    - develop
    - merge_requests
    - feature/*
  when: manual
  allow_failure: true

backend_lint:
  stage: lint
  image: node:${NODE_VERSION}-alpine
  dependencies:
    - backend_install
  script:
    - cd backend || echo "Backend directory not found, skipping backend lint"
    - npm run lint || echo "No backend lint script found"
  cache:
    key: backend-$NPM_CACHE_KEY
    paths:
      - backend/node_modules/
    policy: pull
  only:
    - main
    - develop
    - merge_requests
    - feature/*
  when: manual
  allow_failure: true

backend_test:
  stage: test
  image: node:${NODE_VERSION}-alpine
  services:
    - postgres:13-alpine
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/test_db
  dependencies:
    - backend_install
  script:
    - cd backend || echo "Backend directory not found, skipping backend test"
    - npm run test || echo "No backend test script found"
  cache:
    key: backend-$NPM_CACHE_KEY
    paths:
      - backend/node_modules/
    policy: pull
  only:
    - main
    - develop
    - merge_requests
    - feature/*
  when: manual
  allow_failure: true

# Database Migration (for future SQL database)
database_migrate:
  stage: test
  image: node:${NODE_VERSION}-alpine
  services:
    - postgres:13-alpine
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://test_user:test_password@postgres:5432/test_db
  dependencies:
    - backend_install
  script:
    - cd backend || echo "Backend directory not found, skipping database migration"
    - npm run migrate || echo "No migration script found"
  cache:
    key: backend-$NPM_CACHE_KEY
    paths:
      - backend/node_modules/
    policy: pull
  only:
    - main
    - develop
    - merge_requests
    - feature/*
  when: manual
  allow_failure: true

# Deployment stages
deploy_staging:
  stage: deploy
  image: alpine:latest
  dependencies:
    - frontend_build
  script:
    - echo "Deploying to staging environment"
    - echo "Frontend build artifacts available in dist/"
    # Add your staging deployment commands here
    # Example: rsync, docker build, etc.
  environment:
    name: staging
    url: https://staging.yourdomain.com
  only:
    - develop
  when: manual

deploy_production:
  stage: deploy
  image: alpine:latest
  dependencies:
    - frontend_build
  script:
    - echo "Deploying to production environment"
    - echo "Frontend build artifacts available in dist/"
    # Add your production deployment commands here
    # Example: rsync, docker build, etc.
  environment:
    name: production
    url: https://yourdomain.com
  only:
    - main
  when: manual

# Security scanning (optional)
security_scan:
  stage: test
  image: node:${NODE_VERSION}-alpine
  dependencies:
    - frontend_install
  script:
    - npm audit --audit-level moderate
  cache:
    key: $NPM_CACHE_KEY
    paths:
      - node_modules/
    policy: pull
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests
    - feature/*

# Code quality check (optional)
code_quality:
  stage: test
  image: node:${NODE_VERSION}-alpine
  dependencies:
    - frontend_install
  script:
    - npm run build
    - echo "Code quality check completed"
  artifacts:
    reports:
      codequality: codequality.json
  cache:
    key: $NPM_CACHE_KEY
    paths:
      - node_modules/
    policy: pull
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests
    - feature/*
