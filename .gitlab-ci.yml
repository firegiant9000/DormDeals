stages:
  - install
  - lint
  - build

variables:
  NODE_ENV: production
  NPM_CONFIG_CACHE: ".npm"

default:
  image: node:20-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
      - node_modules/

install:
  stage: install
  script:
    - npm ci --cache .npm --prefer-offline
  artifacts:
    expire_in: 1 week

lint:
  stage: lint
  needs: ["install"]
  script:
    - echo "Running ESLint (flat config)…"
    - npm run lint:ci
  artifacts:
    when: always
    paths:
      - lint-results.xml
    expire_in: 1 week

build:
  stage: build
  needs: ["install"]
  script:
    - npm run type-check
    - npm run build:production
  artifacts:
    paths:
      - dist/
    expire_in: 1 week