stages:
  - lint
  - build
  - deploy

variables:
  NODE_ENV: production
  NPM_CONFIG_CACHE: ".npm"
  # ← ensure devDependencies are installed in CI
  NPM_CONFIG_PRODUCTION: "false"

default:
  image: node:20-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
      - node_modules/
  before_script:
    # fresh container per job → install deps in every job (including dev and optional)
    # Using npm ci for faster, reproducible installs with package-lock.json
    # Install optional dependencies separately to ensure platform-specific binaries are installed
    # (npm ci has known issues with optional dependencies on Alpine Linux)
    - npm ci --cache .npm --prefer-offline --include=dev
    # Workaround for npm ci's optional dependency bug on Alpine Linux
    # Remove rollup and reinstall to trigger optional dependency installation
    - rm -rf node_modules/rollup node_modules/@rollup 2>/dev/null || true
    - npm install --no-save rollup@4.52.4

lint:
  stage: lint
  script:
    - echo "Running ESLint (flat config)…"
    - npx eslint -v
    - npx eslint . --report-unused-disable-directives --max-warnings 0 -f junit -o lint-results.xml || true
  allow_failure: true
  artifacts:
    when: always
    paths:
      - lint-results.xml
    expire_in: 1 week

build:
  stage: build
  script:
    - npx tsc -v
    - npx tsc --noEmit
    - npm run build:production
  artifacts:
    when: always
    paths:
      - dist/
    expire_in: 1 week

deploy_production:
  stage: deploy
  needs:
    - build
  dependencies:
    - build
  script:
    - npm install -g firebase-tools
    - firebase deploy --only hosting --token "$FIREBASE_TOKEN"
  only:
    - main
  environment:
    name: production
    url: https://dormdeals-9cb29.web.app