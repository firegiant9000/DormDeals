stages:
  - lint
  - build

variables:
  NODE_ENV: production
  NPM_CONFIG_CACHE: ".npm"

default:
  image: node:20-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
      - node_modules/
  before_script:
    # Each job gets a fresh container; install deps every time
    - npm ci --cache .npm --prefer-offline

lint:
  stage: lint
  script:
    - echo "Running ESLint (flat config)…"
    - npx eslint -v
    - npm run lint:ci || true
  allow_failure: true
  artifacts:
    when: always
    paths:
      - lint-results.xml
    expire_in: 1 week

build:
  stage: build
  script:
    - npx tsc -v
    - npm run type-check
    - npm run build:production -- --logLevel debug
  artifacts:
    when: always
    paths:
      - dist/
    expire_in: 1 week
