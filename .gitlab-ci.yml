stages:
  - lint
  - build
  - test
  - deploy

variables:
  NODE_ENV: production
  NPM_CONFIG_CACHE: ".npm"
  # ← ensure devDependencies are installed in CI
  NPM_CONFIG_PRODUCTION: "false"

# Reusable dependency install (fresh container per job).
# Using npm ci for faster, reproducible installs with package-lock.json.
# The rollup step works around npm ci's optional-dependency bug on Alpine.
.npm_install: &npm_install
  - npm ci --cache .npm --prefer-offline --include=dev
  - rm -rf node_modules/rollup node_modules/@rollup 2>/dev/null || true
  - npm install --no-save rollup@4.52.4

default:
  image: node:20-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
      - node_modules/
  before_script:
    - *npm_install

lint:
  stage: lint
  script:
    - echo "Running ESLint (flat config)…"
    - npx eslint -v
    # Blocking (G10): a lint regression fails the pipeline. JUnit artifact still emitted.
    - npx eslint . --report-unused-disable-directives --max-warnings 0 -f junit -o lint-results.xml
  artifacts:
    when: always
    paths:
      - lint-results.xml
    expire_in: 1 week

build:
  stage: build
  script:
    - npx tsc -v
    - npx tsc --noEmit
    - npm run build:production
  artifacts:
    when: always
    paths:
      - dist/
    expire_in: 1 week

# Unit tests (Vitest, jsdom). Blocking: a failing unit test fails the pipeline,
# which blocks merge when the project requires green pipelines on MRs.
unit_test:
  stage: test
  needs:
    - build
  script:
    - npx vitest run --reporter=default --reporter=junit --outputFile=junit-unit.xml
  allow_failure: false
  artifacts:
    when: always
    reports:
      junit: junit-unit.xml
    expire_in: 1 week

# Firestore security-rules tests against the emulator (Month 1 #5).
# Blocking: a rules regression should not reach production.
# Needs a JRE for the Firestore emulator; tests seed their own data.
rules_test:
  stage: test
  needs:
    - build
  before_script:
    - apk add --no-cache openjdk17-jre-headless
    - *npm_install
  script:
    - npm run test:rules
  allow_failure: false

# E2E smoke tests (Playwright) against the deployed site.
# Non-blocking for one stabilization month (allow_failure + retry-once).
# Pinned image must match the @playwright/test version in package-lock.json.
e2e_test:
  stage: test
  image: mcr.microsoft.com/playwright:v1.56.1-jammy
  needs:
    - build
  before_script:
    - npm ci --cache .npm --prefer-offline --include=dev
  script:
    # Single browser keeps the non-blocking run fast; the config defines more projects.
    - npx playwright test --project=chromium
  allow_failure: true
  retry: 1
  artifacts:
    when: always
    paths:
      - playwright-report/
    expire_in: 1 week

deploy_production:
  stage: deploy
  needs:
    - build
    - unit_test
    - rules_test
  dependencies:
    - build
  script:
    - npm install -g firebase-tools
    # Deploy rules + indexes alongside hosting (G2) so prod can't drift from the repo.
    # NOTE (G11): CI-token auth is deprecated by Firebase; prefer a service account
    # (GOOGLE_APPLICATION_CREDENTIALS) as the GitHub Actions workflow does.
    - firebase deploy --only hosting,firestore:rules,firestore:indexes --token "$FIREBASE_TOKEN"
  only:
    - main
  environment:
    name: production
    url: https://dormdeals-9cb29.web.app
