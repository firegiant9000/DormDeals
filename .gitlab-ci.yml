stages:
  - lint
  - build

variables:
  NODE_ENV: production
  NPM_CONFIG_CACHE: ".npm"
  # ← ensure devDependencies are installed in CI
  NPM_CONFIG_PRODUCTION: "false"

default:
  image: node:20-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/
      - node_modules/
  before_script:
    # fresh container per job → install deps in every job (including dev)
    - npm ci --cache .npm --prefer-offline --include=dev

lint:
  stage: lint
  script:
    - echo "Running ESLint (flat config)…"
    - npx eslint -v
    - npx eslint . --report-unused-disable-directives --max-warnings 0 -f junit -o lint-results.xml || true
  allow_failure: true
  artifacts:
    when: always
    paths:
      - lint-results.xml
    expire_in: 1 week

build:
  stage: build
  script:
    - npx tsc -v
    - npx tsc --noEmit
    - npm run build:production
  artifacts:
    when: always
    paths:
      - dist/
    expire_in: 1 week
