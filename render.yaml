services:
  - type: web
    name: dormdeals
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && test -f dist/index.html || (echo "Build failed: dist/index.html not found" && exit 1)
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    envVarGroups:
      - name: dormdeals-env
    healthCheckPath: /health


