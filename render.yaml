services:
  - type: web
    name: dormdeals
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && rm -rf node_modules/rollup node_modules/@rollup 2>/dev/null || true && npm install --no-save rollup@4.52.4 && npm run type-check && npm run build && test -f dist/index.html || (echo "Build failed: dist/index.html not found" && exit 1)
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    envVarGroups:
      - name: dormdeals-env
    healthCheckPath: /health

# Environment variable group - add these in Render Dashboard
# Required Firebase variables (for client-side):
# - VITE_FIREBASE_API_KEY
# - VITE_FIREBASE_AUTH_DOMAIN
# - VITE_FIREBASE_PROJECT_ID
# - VITE_FIREBASE_STORAGE_BUCKET
# - VITE_FIREBASE_MESSAGING_SENDER_ID
# - VITE_FIREBASE_APP_ID
# - VITE_FIREBASE_MEASUREMENT_ID (optional)
#
# Required Server variables:
# - DATABASE_URL
# - SECRET_KEY
# - JWT_SECRET


