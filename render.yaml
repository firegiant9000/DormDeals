services:
  - type: web
    name: dormdeals
    runtime: node
    plan: free
    rootDir: .
    buildCommand: pwd && npm ci && npm run build && pwd && ls -la && ls -la dist/ 2>&1 && test -f dist/index.html || (echo "Build failed: dist/index.html not found" && exit 1)
    startCommand: cd /opt/render/project && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    envVarGroups:
      - name: dormdeals-env
    healthCheckPath: /health


